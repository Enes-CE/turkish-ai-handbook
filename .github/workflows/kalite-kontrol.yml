name: Kalite kontrolü

on:
  pull_request:
    paths: ['**.md', 'tools/**']
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Künye, isimlendirme ve link kontrolü
        run: python3 tools/kontrol.py
